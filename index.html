<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas</title>
<meta name="theme-color" content="#080b10">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-512.png">
<script>try{var s=JSON.parse(localStorage.getItem('caudal_v1')||'{}').settings||{};var t=s.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):(s.theme||'dark');document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app-root">
  <aside class="side" aria-label="Navegación">
    <button class="logo" type="button" data-go="resumen"><img src="icon-192.png" alt="">Finanzas <span class="badge" id="ver-badge">v12</span></button>
    <div id="nav-side"></div>
    <div class="side-foot">
      <button class="sync" type="button" data-act="sync-now" id="sync-side"></button>
      <div class="row" style="justify-content:space-between">
        <span class="faint" id="ver-side" style="font-size:12px"></span>
        <span class="row" style="gap:6px">
          <button class="iconbtn" type="button" data-act="hide" id="hide-side" aria-label="Ocultar importes"></button>
          <button class="iconbtn" type="button" data-act="theme" id="theme-side" aria-label="Modo claro u oscuro"></button>
        </span>
      </div>
    </div>
  </aside>
  <div class="main-col">
    <header class="desktop-topbar" id="desktop-topbar"></header>
    <header class="topbar">
      <button class="iconbtn" type="button" data-act="drawer" aria-label="Abrir menú" aria-controls="mobile-drawer" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="mobile-title" id="mobile-title">Inicio</span>
      <span class="grow"></span>
      <button class="iconbtn" type="button" data-act="sync-now" id="sync-top" aria-label="Sincronizar"></button>
      <button class="iconbtn" type="button" data-act="hide" id="hide-top" aria-label="Ocultar importes"></button>
      <button class="iconbtn" type="button" data-act="theme" id="theme-top" aria-label="Modo claro u oscuro"></button>
    </header>
    <main id="main"></main>
  </div>
  <button class="mobile-fab" type="button" data-act="quick" aria-label="Añadir movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabs" id="nav-tabs" aria-label="Secciones principales"></nav>
  <div class="drawer-scrim" id="drawer-scrim" data-act="drawer-close"></div>
  <aside class="drawer" id="mobile-drawer" aria-label="Menú" aria-hidden="true">
    <div class="drawer-head">
      <img src="icon-192.png" alt="">
      <span><b>Finanzas</b><small class="faint" style="display:block" id="ver-drawer"></small></span>
      <button class="iconbtn" type="button" data-act="drawer-close" aria-label="Cerrar menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="drawer-nav" id="nav-drawer"></div>
    <div class="drawer-foot">
      <button class="sync" type="button" data-act="sync-now" id="sync-drawer"></button>
      <div class="quickrow">
        <button class="btn" type="button" data-act="import">Importar</button>
        <button class="btn primary" type="button" data-act="quick">Apuntar</button>
      </div>
    </div>
  </aside>
</div>
<div class="ai-drawer-backdrop" id="ai-drawer-backdrop" data-act="ai-drawer-close"></div>
<aside class="ai-drawer" id="ai-drawer" aria-label="Copiloto IA" aria-hidden="true"></aside>
<dialog id="modal" aria-labelledby="modal-title"><div class="dlg-h"><h3 id="modal-title"></h3><button class="btn ghost small" type="button" id="modal-close" aria-label="Cerrar">Cerrar</button></div><div class="dlg-b" id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Deshacer</button></div>
<input type="file" id="file-in" accept=".xlsx,.csv,.txt,.json,.ofx,.qfx,.qif,.pdf,.png,.jpg,.jpeg,.webp" multiple hidden>
<script src="js/state.js"></script>
<script src="js/finance.js"></script>
<script src="js/charts.js"></script>
<script src="js/importers.js"></script>
<script src="js/live.js"></script>
<script src="js/connectors.js"></script>
<script src="js/ai.js"></script>
<script src="js/views-desktop.js"></script>
<script src="js/views-mobile.js"></script>
<script src="js/app.js"></script>
<script>try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}</script>
</body>
</html>
