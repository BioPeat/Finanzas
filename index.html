     :'<p>Tus datos se cifran en este dispositivo antes de salir. Ni el Worker ni nadie puede leerlos.</p>'+btn('Activar sincronización','data-act="sync-on"','primary'))+'</section>'
  +'<section class="panel span12"><h2>Conexión: Worker de Cloudflare (gratis)</h2><p class="muted" style="margin-top:0">Hace tres cosas: lee tus exchanges con claves de solo lectura (que nunca están en la app), trae precios de ETF y fondos, y guarda la copia cifrada para el móvil.</p>'
   +'<div class="form"><label class="f">Dirección del Worker<input type="url" id="set-worker" value="'+esc(s.worker)+'" placeholder="https://finanzas.tu-nombre.workers.dev"></label><label class="f">Código (secreto TOKEN)<input type="text" id="set-token" value="'+esc(s.token)+'" placeholder="Pulsa Generar"></label></div>'
   +'<div class="row" style="margin-top:10px">'+btn('Guardar y probar','data-act="worker-test"','primary')+btn('Generar código','data-act="gen-token"')+btn('Copiar código del Worker','data-act="copy-worker"')+'</div><div id="worker-res" style="margin-top:10px">'+(state.workerInfo?workerInfoHTML(state.workerInfo):'')+'</div>'
   +'<details style="margin-top:12px"'+(on?'':' open')+'><summary><b>Cómo montarlo (10 minutos, una sola vez)</b></summary><ol class="steps" style="margin-top:10px">'+WORKER_STEPS.map(x=>'<li><div>'+x+'</div></li>').join('')+'</ol>'
   +'<div class="label" style="margin-top:16px">Claves de solo lectura de cada exchange</div><div class="kv" style="grid-template-columns:auto 1fr;gap:8px 14px"><dt><b>Binance</b></dt><dd style="text-align:left;font-weight:400">Perfil → Gestión de API → Crear API → «generada por el sistema». Deja marcada <b>solo</b> «Habilitar lectura». Secretos: <code>BINANCE_KEY</code> y <code>BINANCE_SECRET</code>.</dd>'
   +'<dt><b>Kraken</b></dt><dd style="text-align:left;font-weight:400">Configuración → API → Crear clave. Permisos: Consultar fondos, Consultar órdenes y operaciones, Consultar libro mayor. Nada más. Secretos: <code>KRAKEN_KEY</code> y <code>KRAKEN_SECRET</code>.</dd>'
   +'<dt><b>KuCoin</b></dt><dd style="text-align:left;font-weight:400">Gestión de API → Crear API → permiso «General» (solo lectura) y una frase de contraseña. Secretos: <code>KUCOIN_KEY</code>, <code>KUCOIN_SECRET</code> y <code>KUCOIN_PASSPHRASE</code>.</dd></div>'
   +'<p class="note">Nunca actives permisos de operar ni de retirar. Si una clave se filtrara, solo serviría para ver saldos.</p></details></section>'
  +'<section class="panel span6"><h2>Reglas aprendidas y datos</h2>'+(state.rules.length?'<div class="list">'+state.rules.map((r,i)=>'<div class="item" style="cursor:default"><b>'+esc(r.match)+'</b><button class="btn ghost small" type="button" data-act="rule-del" data-id="'+i+'">Quitar</button><small>→ '+esc(catById(r.cat).name)+'</small><small></small></div>').join('')+'</div>':'<p class="muted">Cuando cambies la categoría de un movimiento, se recordará para los siguientes del mismo comercio.</p>')
   +'<div class="label" style="margin-top:18px">Tus datos</div><div class="row">'+btn('Exportar copia (JSON)','data-act="export"')+btn('Importar copia','data-act="import"')+btn('Borrar todo','data-act="wipe"','danger')+'</div><p class="note">Versión '+APP_VERSION+' · <a href="actualizar.html">Aplicar cambios de la IA</a></p></section>'
  +'</div>';
}
function workerInfoHTML(i){
  if(i.error)return '<div class="callout err">'+esc(i.error)+'</div>';
  const ex=Object.entries(i.exchanges||{});
  return '<div class="callout ok">Worker conectado'+(i.kv?' · copia cifrada lista':' · <b>falta enlazar el KV «CAUDAL»</b> (paso 4)')+'.<br>'+(ex.length?'Exchanges: '+ex.map(([k,v])=>EXCH[k]+(v?' ✓':' (sin claves)')).join(' · '):'')+'</div>';
}
function vMas(){
  return head('Más','')+'<div class="panel"><div class="list">'
   +VIEWS.filter(v=>!['resumen','movimientos','inversiones'].includes(v[0])).map(([v,t,i])=>'<button class="item" type="button" data-go="'+v+'"><span class="av" style="background:var(--brand-soft);color:var(--brand)">'+ico(i)+'</span><b>'+t+'</b><span class="faint">›</span><small>'+({objetivos:'Ahorro y presupuestos',impuestos:'Borrador de la renta, FIFO y modelo 721',cuentas:'Bancos, exchanges y monederos',ajustes:'Conexiones, sincronización y datos'}[v]||'')+'</small><small></small></button>').join('')
   +'<button class="item" type="button" data-act="export"><span class="av" style="background:var(--brand-soft);color:var(--brand)">'+ico('upload')+'</span><b>Copia de seguridad</b><span class="faint">›</span><small>Descargar todos tus datos (JSON)</small><small></small></button></div></div>';
}

// ===== Ventana, descargas y acciones =====
function modal(title,html){$('modal-title').innerHTML=title;$('modal-body').innerHTML=html;if(!$('modal').open)$('modal').showModal();$('modal-body').scrollTop=0;}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function copyText(t,msg='Copiado'){try{await navigator.clipboard.writeText(t);toast(msg);}catch(e){modal('Copia este texto','<textarea style="min-height:240px">'+esc(t)+'</textarea>');}}
const randKey=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
const val=id=>$(id)?.value??'';
const numv=id=>{const v=toNum(val(id));return isFinite(v)?v:null;};
async function act(a,el){
  const id=el.dataset.id;
  switch(a){
   case 'import':$('file-in').click();break;
   case 'refresh':await syncBalances(true);break;
   case 'prices':await refreshPrices(true);toast('Precios actualizados');break;
   case 'clear-filt':filt={q:'',m:'',cat:'',acc:'',type:'',day:''};render();break;
   case 'add-tx':case 'quick':quickAdd();break;
   case 'q-save':{
     const amt=Math.abs(numv('q-amt')||0),desc=val('q-desc').trim()||catById(val('q-cat')).name;
     if(!amt)return toast('Escribe el importe.');
     change(()=>{let acc=val('q-acc');if(acc==='__cash'){const a={id:'a_'+uid(),name:'Efectivo',kind:'cash',inst:'',currency:'EUR',manualBal:0};state.accounts.push(a);acc=a.id;}
       state.tx.push({id:'t_'+uid(),acc,date:val('q-date')||today(),desc,amount:round(qType==='out'?-amt:amt),bal:null,cat:val('q-cat'),note:'',src:'manual'});},(qType==='out'?'Gasto':'Ingreso')+' añadido');
     $('modal').close();break;}
   case 'goal-new':editGoal('');break;
   case 'goal-save':{const name=val('g-name').trim(),target=numv('g-target');if(!name||!target)return toast('Pon un nombre y una cantidad.');
     change(()=>{let g=state.goals.find(x=>x.id===id);if(!g){g={id:'g_'+uid()};state.goals.push(g);}Object.assign(g,{name,target,date:val('g-date'),acc:val('g-acc'),saved:numv('g-saved')||0});},'Objetivo guardado');$('modal').close();break;}
   case 'goal-del':change(()=>{state.goals=state.goals.filter(x=>x.id!==id);},'Objetivo eliminado');$('modal').close();break;
   case 'theme':change(()=>{state.settings.theme=document.documentElement.dataset.theme==='light'?'dark':'light';});break;
   case 'hide':change(()=>{state.settings.hide=!state.settings.hide;});break;
   case 'menu':openDrawer();break;
   case 'menu-close':closeDrawer();break;
   case 'forecast':{const f=forecast();modal('Previsión a fin de mes','<div class="kv"><dt>Saldo de hoy (banco y efectivo)</dt><dd>'+money(f.bal)+'</dd>'+(f.salary?'<dt>Nómina que aún no ha llegado</dt><dd class="up">'+money(f.salary,{sign:true})+'</dd>':'')+'<dt>Cargos fijos pendientes</dt><dd>'+money(-f.fixed)+'</dd><dt>Gasto normal previsto ('+Math.round(f.left)+' días)</dt><dd>'+money(-f.variable)+'</dd><dt><b>Saldo estimado</b></dt><dd><b>'+money(f.end)+'</b></dd></div><p class="note">El gasto normal es tu media diaria de los 3 últimos meses sin contar los cargos fijos. La nómina se suma si este mes aún no ha llegado.</p>');break;}
   case 'cushion':{const c=cushion();modal('Colchón de emergencia','<div class="big" style="font-size:36px">'+(c!=null?nf(c,1,1)+' meses':'—')+'</div><div class="kv" style="margin-top:14px"><dt>Dinero disponible</dt><dd>'+money(liquidity())+'</dd><dt>Gasto medio al mes</dt><dd>'+money(avgMonthlyExpense())+'</dd></div><p class="note">Es cuánto tiempo podrías cubrir tus gastos con el dinero que tienes a mano (banco, efectivo y stablecoins), sin vender inversiones. Lo recomendable es tener de 3 a 6 meses.</p>'+btn(ico('target')+'Crear objetivo de colchón','data-act="goal-new"','small'));break;}
   case 'tx-save':{
     const cat=val('tx-cat'),note=val('tx-note').trim();
     if(!id){const amt=numv('tx-amt'),desc=val('tx-desc').trim();if(amt==null||!desc)return toast('Pon un concepto y un importe.');change(()=>state.tx.push({id:'t_'+uid(),acc:val('tx-acc'),date:val('tx-date'),desc,amount:round(amt),bal:null,cat,note,src:'manual'}),'Movimiento añadido');}
     else{const t=state.tx.find(x=>x.id===id),mer=merchantOf(t.desc),all=$('tx-all')?.checked;
       change(()=>{t.cat=cat;t.note=note;if(all){state.rules=state.rules.filter(r=>r.match!==mer);state.rules.unshift({id:'r:'+mer,match:mer,cat});for(const x of state.tx)if(merchantOf(x.desc)===mer)x.cat=cat;}},all?'Categoría aplicada a «'+mer+'» (y a los próximos)':'Guardado');}
     $('modal').close();break;}
   case 'tx-del':change(()=>{state.tx=state.tx.filter(x=>x.id!==id);},'Movimiento eliminado');$('modal').close();break;
   case 'add-op':editOp('');break;
   case 'op-save':{
     const acc=val('op-acc'),date=val('op-date')+' 12:00:00',asset=normAsset(val('op-asset')),qty=numv('op-qty');
     if(!acc||!asset||!qty)return toast('Completa cuenta, activo y cantidad.');
     if(id){change(()=>{const l=state.ledger.find(x=>x.id===id);Object.assign(l,{acc,t:l.t.slice(0,10)===val('op-date')?l.t:date,asset,change:qty,kind:val('op-kind')});},'Operación guardada');}
     else{const k=val('op-kind'),eur=numv('op-eur'),fee=numv('op-fee')||0,ref='man|'+uid();
       change(()=>{ensureAsset(asset);const add=(o)=>state.ledger.push({id:'l_'+uid(),acc,t:date,ref,src:'manual',note:'Manual',...o});
         if(k==='buy'){add({asset,change:Math.abs(qty),kind:'trade'});add({asset:'EUR',change:-Math.abs(eur||0)-fee,kind:'trade'});}
         else if(k==='sell'){add({asset,change:-Math.abs(qty),kind:'trade'});add({asset:'EUR',change:Math.abs(eur||0)-fee,kind:'trade'});}
         else if(k==='deposit'){const l={id:'l_'+uid(),acc,t:date,ref,asset,change:Math.abs(qty),kind:'deposit',src:'manual',note:'Manual'};state.ledger.push(l);if(eur!=null)state.costs[l.id]=Math.abs(eur)+fee;}
         else if(k==='reward')add({asset,change:Math.abs(qty),kind:'reward'});
         else add({asset,change:-Math.abs(qty),kind:'withdraw'});
       },'Operación añadida');refreshPrices();}
     $('modal').close();break;}
   case 'op-del':change(()=>{state.ledger=state.ledger.filter(x=>x.id!==id);},'Operación eliminada');$('modal').close();break;
   case 'asset-save':change(()=>{const x=state.assets[id]=state.assets[id]||{};x.cls=val('as-cls');x.yahoo=val('as-yahoo').trim();x.name=val('as-name').trim();},'Activo guardado');$('modal').close();refreshPrices();break;
   case 'add-deriv':editDeriv('');break;
   case 'dv-save':{
     const g=k=>val('dv-'+k),n=k=>numv('dv-'+k);
     const d={id:id||'d_'+uid(),instr:g('instr').trim(),type:g('type'),side:g('side'),size:n('size'),entry:n('entry'),lev:n('lev'),margin:n('margin'),quote:g('quote'),markSym:normAsset(g('markSym')),mark:n('mark'),closeDate:g('closeDate'),exit:n('exit'),fees:n('fees')};
     if(!d.instr||!d.size||!d.entry)return toast('Pon instrumento, tamaño y precio de entrada.');
     change(()=>{const i=state.derivs.findIndex(x=>x.id===d.id);if(i>=0)state.derivs[i]=d;else state.derivs.push(d);},'Posición guardada');$('modal').close();if(d.markSym)refreshPrices();break;}
   case 'dv-del':change(()=>{state.derivs=state.derivs.filter(x=>x.id!==id);state.deleted[id]=Date.now();},'Posición eliminada');$('modal').close();break;
   case 'add-acc':editAcc('');break;
   case 'acc-save':{const name=val('ac-name').trim();if(!name)return toast('Ponle un nombre.');
     change(()=>{let a=accById(id);if(!a){a={id:'a_'+uid(),currency:'EUR'};state.accounts.push(a);}Object.assign(a,{name,kind:val('ac-kind'),inst:val('ac-inst').trim(),manualBal:numv('ac-bal'),reportsSpain:$('ac-rs').checked});if($('ac-api'))a.useApi=$('ac-api').checked;},'Cuenta guardada');$('modal').close();break;}
   case 'acc-del':if(!confirmTwice(el))return;change(()=>{state.accounts=state.accounts.filter(a=>a.id!==id);state.tx=state.tx.filter(t=>t.acc!==id);state.ledger=state.ledger.filter(l=>l.acc!==id);delete state.apiBal[id];state.deleted[id]=Date.now();},'Cuenta eliminada');$('modal').close();break;
   case 'budgets':go('objetivos');break;
   case 'rule-del':change(()=>state.rules.splice(+id,1),'Regla quitada');break;
   case 'export':download('Finanzas_copia_'+today()+'.json',JSON.stringify(syncPayload(),null,1));break;
   case 'wipe':if(!confirmTwice(el))return;{const keep=clone(state.settings);change(()=>{state=defaults();state.settings=keep;},'Datos borrados');}break;
   case 'gen-token':$('set-token').value=randKey(24);toast('Código generado: guárdalo y pégalo también como secreto TOKEN en el Worker.');break;
   case 'copy-worker':try{const r=await fetch('worker.js',{cache:'no-store'});if(!r.ok)throw 0;await copyText(await r.text(),'Código del Worker copiado. Pégalo en Cloudflare.');}catch(e){toast('No encuentro worker.js junto a la app.');}break;
   case 'worker-test':{
     state.settings.worker=val('set-worker').trim().replace(/\/+$/,'');state.settings.token=val('set-token').trim();save(false);
     $('worker-res').innerHTML='<p class="muted">Probando…</p>';
     try{state.workerInfo=await api('/ping');}catch(e){state.workerInfo={error:e.message};}
     $('worker-res').innerHTML=workerInfoHTML(state.workerInfo);if(!state.workerInfo.error){syncBalances();if(state.settings.sync)syncNow();}
     break;}
   case 'sync-on':state.settings.sync=randKey(32);state.settings.lastSync=0;state.settings.lastRemote=0;state.settings.lastPush=0;state.settings.pushed=-1;save(false);await syncNow(true);render();break;
   case 'sync-off':state.settings.sync='';save(false);render();break;
   case 'sync-now':if(!syncOn()){go('ajustes');toast('Activa la sincronización en Ajustes.');break;}await syncNow(true);if(state.settings.worker)syncBalances();break;
   case 'pair-copy':copyText(pairLink(),'Enlace copiado. Ábrelo en el móvil.');break;
   case 'pair-share':navigator.share({title:'Finanzas',text:'Vincular Finanzas',url:pairLink()}).catch(()=>{});break;
   case 'tax-prices':{taxBusy=true;render();try{const n=await taxPrefetch((i,t)=>{const b=document.querySelector('[data-act="tax-prices"]');if(b)b.textContent='Precios '+i+' de '+t+'…';});toast(n?'Precios históricos descargados: '+n:'Ya estaban todos los precios');}catch(e){toast(e.message);}taxBusy=false;render();break;}
   case 'tax-csv':taxCSV(String(state.settings.taxYear||val('tax-year')));break;
   case 'tax-ai':copyText(taxAIText(val('tax-year')),'Copiado: pégalo en Gemini, Claude o envíalo a tu gestor.');break;
   case 'tax-721':{const y=val('tax-year');el.textContent='Calculando…';const r=await modelo721(y);m721={...r,year:y};render();break;}
  }
}
// Las acciones que borran mucho piden un segundo toque.
function confirmTwice(el){if(el.dataset.sure)return true;el.dataset.sure='1';el.textContent='Toca otra vez para confirmar';setTimeout(()=>{delete el.dataset.sure;},4000);return false;}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-go],[data-act],[data-tx],[data-range],[data-dismiss],[data-asset],[data-acc],[data-deriv],[data-op],[data-set],[data-invview],[data-fcat],[data-day],[data-qtype],[data-pick],[data-goal]');if(!t)return;
  const d=t.dataset;
  if(d.act){e.preventDefault();await act(d.act,t);return;}
  if(d.go){if($('modal').open)$('modal').close();go(d.go,d.gof?JSON.parse(d.gof):null);return;}
  if(d.tx){editTx(d.tx);return;}
  if(d.fcat!=null){filt.cat=d.fcat;render();return;}
  if(d.day){filt.day=filt.day===d.day?'':d.day;filt.m=d.day.slice(0,7);render();return;}
  if(d.qtype){qType=d.qtype;const keep={a:val('q-amt'),d:val('q-desc'),dt:val('q-date')};quickAdd();$('q-amt').value=keep.a;$('q-desc').value=keep.d;$('q-date').value=keep.dt;return;}
  if(d.pick){const box=t.parentElement;box.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));const h=box.nextElementSibling;if(h&&h.type==='hidden')h.value=d.pick;return;}
  if(d.goal){editGoal(d.goal);return;}
  if(d.range){range=d.range;render();return;}
  if(d.invview){invView=d.invview;render();return;}
  if(d.dismiss){state.dismissed[d.dismiss]=Date.now();save(false);render();return;}
  if(d.asset){assetDetail(d.asset);return;}
  if(d.acc){editAcc(d.acc);return;}
  if(d.deriv){editDeriv(d.deriv);return;}
  if(d.op){editOp(d.op);return;}
  if(d.set){let v=d.val;if(v==='true'||v==='false')v=v==='true';change(()=>{state.settings[d.set]=v;});if(d.set==='show')refreshPrices();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){filt.q=t.value;clearTimeout(t._tm);t._tm=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('f-q');n.focus();n.setSelectionRange(pos,pos);},250);}
});
document.addEventListener('change',e=>{
  const t=e.target,m={'f-m':'m','f-cat':'cat','f-type':'type','f-acc':'acc'}[t.id];
  if(m){filt[m]=t.value;render();return;}
  if(t.id==='tax-year'){state.settings.taxYear=t.value;m721=null;save(false);render();return;}
  if(t.id==='tax-extra'){taxExtra=toNum(t.value)||0;render();return;}
  if(t.id==='set-low'){change(()=>{state.settings.lowBal=toNum(t.value)||0;});return;}
  if(t.dataset.budget){const v=toNum(t.value);change(()=>{if(v>0)state.budgets[t.dataset.budget]=v;else delete state.budgets[t.dataset.budget];});return;}
  if(t.dataset.cost){const v=toNum(t.value);change(()=>{if(isFinite(v))state.costs[t.dataset.cost]=v;else delete state.costs[t.dataset.cost];},'Coste guardado');return;}
  if(t.id==='file-in'){importFiles([...t.files]);t.value='';}
});
function afterRender(){
  bindCharts();
  const drop=$('drop');
  if(drop&&!drop._b){drop._b=1;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));drop.addEventListener('drop',e=>importFiles([...e.dataTransfer.files]));}
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{if(!e.target.closest('#drop')){e.preventDefault();if(e.dataTransfer?.files?.length)importFiles([...e.dataTransfer.files]);}});
$('modal-close').onclick=()=>$('modal').close();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
$('toast-undo').onclick=undo;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='auto')render();});

// ===== Arranque =====
// Todo se actualiza solo: precios, saldos de los exchanges y sincronización, al abrir, al volver a la app, al recuperar internet y cada poco mientras está abierta.
function refreshAll(force){
  snapshot();
  if(syncOn())syncNow();
  if(state.settings.worker){if(force||Date.now()-(state.apiTs||0)>5*60e3)syncBalances();}
  else if(state.accounts.length)refreshPrices();
}
function init(){
  readPair();
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)||h==='mas')view=h;
  if(h==='quick')view='resumen';
  ready=true;snapshot();render();
  if(h==='quick')setTimeout(quickAdd,100);
  document.body.dataset.ready='true';
  if(state.accounts.length)refreshPrices();
  if(state.settings.worker){syncNow();syncBalances();}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll();});
  addEventListener('online',()=>refreshAll());
  addEventListener('focus',()=>{if(syncOn())syncNow();});
  // Cada minuto mira si el otro dispositivo ha cambiado algo; cada N minutos, precios y saldos.
  setInterval(()=>{if(document.visibilityState==='visible'&&syncOn())syncNow();paintSync();},60e3);
  setInterval(()=>{if(document.visibilityState!=='visible')return;if(state.settings.worker)syncBalances();else if(state.accounts.length)refreshPrices();snapshot();},Math.max(5,+state.settings.autoMinutes||15)*60e3);
}
