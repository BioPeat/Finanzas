// ===== Inversiones =====
function costBasis(){const r=taxCompute(),out={};for(const [a,ls] of Object.entries(r.lots)){const q=sum(ls.map(l=>l.qty));out[a]={qty:q,cost:sum(ls.map(l=>l.qty*l.cpu)),missing:ls.some(l=>l.missing&&l.qty>1e-9)};}return out;}
// Serie del valor de las inversiones (todo menos el dinero en cuentas) a partir de las fotos diarias.
function invSeries(days){
  const from=addDays(today(),-days);
  return Object.keys(state.snaps).sort().filter(d=>d>=from).map(d=>{const s=state.snaps[d];return [d,(s.total||0)-(s.cash||0)];});
}
function portfolioMetrics(list,total){
  const positive=list.filter(x=>x.eur>0),gross=sum(positive.map(x=>x.eur)),top=positive[0]||{eur:0},day=gross?sum(positive.map(x=>x.eur*(state.prices[x.asset]?.chg||0)))/gross:0,classes={};for(const x of positive)classes[x.cls||assetCls(x.asset)]=(classes[x.cls||assetCls(x.asset)]||0)+x.eur;const stable=sum(positive.filter(x=>assetCls(x.asset)==='stable'||FIAT.includes(x.asset)).map(x=>x.eur));return {total:gross,top:gross?top.eur/gross*100:0,day,classes,stable:gross?stable/gross*100:0,count:positive.length};
}
function portfolioScore(pm,coverage){
  if(!pm.count)return null;let score=100;
  score-=Math.max(0,pm.top-30)*.9;score-=pm.count<3?18:pm.count<5?8:0;score-=Math.max(0,70-coverage)*.22;score-=pm.stable<2?5:0;
  return Math.max(0,Math.min(100,Math.round(score)));
}
function decisionPanel(pm,coverage,list){

  else{
    rows.push([pm.top>40?'Revisar':'Controlado','Mayor posición: '+nf(pm.top,0)+' %. '+(pm.top>40?'Comprueba si esa concentración es intencional.':'Por debajo del umbral de revisión del 40 %.'),pm.top>40?'warn':'ok']);
    rows.push([coverage<80?'Datos incompletos':'Coste cubierto','Coste FIFO fiable para '+nf(coverage,0)+' % de la cartera. '+(coverage<80?'Importa compras y comisiones antes de juzgar rentabilidad.':'La rentabilidad acumulada es interpretable.'),coverage<80?'warn':'ok']);
    rows.push([pm.stable<5?'Liquidez baja':'Liquidez','Liquidez estable: '+nf(pm.stable,0)+' %. Evalúala junto a tu colchón fuera de la cartera.',pm.stable<5?'info':'ok']);
  }
  return '<section class="panel decision-panel"><div class="module-title">Decisiones antes de mover dinero</div>'+rows.map((r,i)=>'<div class="decision-card '+r[2]+'"><span>'+String(i+1).padStart(2,'0')+'</span><div><b>'+r[0]+'</b><p>'+r[1]+'</p></div></div>').join('')+'</section>';

function vInv(){
  const nw=netWorth(),rows=nw.rows.filter(r=>!r.bank),by={};for(const r of rows){const x=by[r.asset]=by[r.asset]||{asset:r.asset,qty:0,eur:0,accs:[],cls:r.cls};x.qty+=r.qty;x.eur+=r.eur;x.accs.push(r.acc);}const list=Object.values(by).filter(x=>Math.abs(x.eur)>=.5||!priceEUR(x.asset)).sort((a,b)=>b.eur-a.eur),total=sum(list.map(x=>x.eur)),cb=costBasis(),ders=derivRows();let cost=0,costOk=0;for(const x of list){const c=cb[x.asset];if(c&&!FIAT.includes(x.asset)&&Math.abs(c.qty-x.qty)<=Math.max(Math.abs(x.qty)*.05,1e-8)){x.cost=c.cost*(x.qty/c.qty);x.costMissing=c.missing;if(!c.missing){cost+=x.cost;costOk+=x.eur;}}}const day=sum(list.map(x=>{const p=state.prices[x.asset];return p&&p.chg!=null?x.eur-x.eur/(1+p.chg/100):0;})),pts=invSeries(rangeDays()),pm=portfolioMetrics(list,total),dn=invDonut(list,pm.total),gain=costOk-cost,coverage=pm.total?costOk/pm.total*100:0,trends=state.market._trends?.rows||[],ops=state.ledger.slice().sort((a,b)=>b.t.localeCompare(a.t)),score=portfolioScore(pm,coverage);
  const acts=(state.settings.worker?btn(ico('sync')+'Actualizar','data-act="refresh"','small'):btn(ico('sync')+'Precios','data-act="prices"','small'))+btn(ico('plus')+'Operación','data-act="add-op"','small');

  const health='<section class="panel health-panel"><div class="module-title">Salud de cartera</div><div class="score-ring" style="--score:'+(score??0)+'"><b>'+(score??'—')+'</b><span>'+(score==null?'sin datos':score>=80?'sólida':score>=60?'a revisar':'frágil')+'</span></div><div class="health-metrics"><span><small>Mayor posición</small><b>'+nf(pm.top,0)+' %</b></span><span><small>Coste fiable</small><b>'+nf(coverage,0)+' %</b></span><span><small>Liquidez estable</small><b>'+nf(pm.stable,0)+' %</b></span><span><small>Activos</small><b>'+pm.count+'</b></span></div></section>';

function taxCSV(year){
  const s=taxSummary(year,taxExtra),q=v=>'"'+String(v).replace(/"/g,'""')+'"',n=v=>nf(v,2,2).replace(/\./g,'');
  const L=[['Bloque','Fecha','Moneda','Contraprestación','Cantidad','Valor de transmisión (€)','Valor de adquisición (€)','Resultado (€)'].map(q).join(';')];
  for(const c of byCoin(s.disp))L.push(['Resumen por moneda','',c.asset,c.contra==='fiat'?'Fiat':'Moneda virtual','',n(c.proceeds),n(c.cost),n(c.gain)].map(q).join(';'));
  for(const d of s.disp)L.push(['Operación',d.t.slice(0,10),d.asset,d.contra==='fiat'?'Fiat':'Moneda virtual',nf(d.qty,8,0),n(d.proceeds),n(d.cost),n(d.gain)].map(q).join(';'));
  for(const r of s.rewards)L.push(['Recompensa',r.t.slice(0,10),r.asset,'',nf(r.qty,8,0),'','',n(r.eur)].map(q).join(';'));
  for(const r of s.derivs)L.push(['Derivados',r.t.slice(0,10),r.asset,'',nf(r.qty,8,0),'','',n(r.eur)].map(q).join(';'));
  download('Finanzas_renta_'+year+'.csv','\ufeff'+L.join('\n'),'text/csv');
}

function resetDrawerGesture(){const d=$('mobile-drawer'),s=$('drawer-scrim');if(!d)return;d.classList.remove('gesture');s.classList.remove('gesture');d.style.transform='';s.style.opacity='';}
function openDrawer(){const d=$('mobile-drawer'),s=$('drawer-scrim');if(!d)return;resetDrawerGesture();d.classList.add('open');s.classList.add('open');d.setAttribute('aria-hidden','false');document.querySelector('[data-act=drawer]')?.setAttribute('aria-expanded','true');}
function closeDrawer(){const d=$('mobile-drawer'),s=$('drawer-scrim');if(!d)return;resetDrawerGesture();d.classList.remove('open');s.classList.remove('open');d.setAttribute('aria-hidden','true');document.querySelector('[data-act=drawer]')?.setAttribute('aria-expanded','false');}
let gesture=null;
function gestureStart(e){
  if(innerWidth>=1024||e.pointerType==='mouse'||e.isPrimary===false)return;
  const modalOpen=$('modal')?.open,target=e.target;
  if(modalOpen&&target.closest('.dlg-h'))gesture={mode:'sheet',x:e.clientX,y:e.clientY,id:e.pointerId};
  else if($('mobile-drawer')?.classList.contains('open'))gesture={mode:'drawer',x:e.clientX,y:e.clientY,id:e.pointerId};
  else if(e.clientX<=26)gesture={mode:'edge',x:e.clientX,y:e.clientY,id:e.pointerId};
  else if(CORE_VIEWS.includes(view)&&!target.closest('button,a,input,select,textarea,dialog,.ichart,.strip,.scroll,[data-asset],[data-acc]'))gesture={mode:'page',x:e.clientX,y:e.clientY,id:e.pointerId};
}
function gestureMove(e){
  if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture.dx=dx;gesture.dy=dy;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  if(gesture.mode==='edge'){
    if(dx<=0||Math.abs(dy)>Math.abs(dx)*1.2)return; e.preventDefault();const d=$('mobile-drawer'),w=d.offsetWidth,x=Math.min(w,dx);d.classList.add('gesture');$('drawer-scrim').classList.add('gesture','open');d.style.transform='translateX('+(-w+x)+'px)';$('drawer-scrim').style.opacity=String(x/w*.9);
  }else if(gesture.mode==='drawer'){
    if(dx>=0||Math.abs(dy)>Math.abs(dx)*1.2)return;e.preventDefault();const d=$('mobile-drawer'),x=Math.max(-d.offsetWidth,dx);d.classList.add('gesture');$('drawer-scrim').classList.add('gesture');d.style.transform='translateX('+x+'px)';$('drawer-scrim').style.opacity=String(Math.max(0,1+x/d.offsetWidth));
  }else if(gesture.mode==='sheet'){
    if(dy<=0||Math.abs(dx)>Math.abs(dy))return;e.preventDefault();$('modal').classList.add('dragging');$('modal').style.transform='translateY('+Math.min(180,dy)+'px)';
  }else if(gesture.mode==='page'&&Math.abs(dx)>Math.abs(dy)*1.35)e.preventDefault();
}
function gestureEnd(e){
  if(!gesture||e.pointerId!==gesture.id)return;const g=gesture;gesture=null;
  if(g.mode==='edge'){if((g.dx||0)>64)openDrawer();else closeDrawer();}
  else if(g.mode==='drawer'){if((g.dx||0)<-64)closeDrawer();else openDrawer();}
  else if(g.mode==='sheet'){const m=$('modal');m.classList.remove('dragging');m.style.transform='';if((g.dy||0)>82)m.close();}
  else if(g.mode==='page'&&Math.abs(g.dx||0)>78&&Math.abs(g.dx)>Math.abs(g.dy||0)*1.35){const i=CORE_VIEWS.indexOf(view),n=g.dx<0?i+1:i-1;if(n>=0&&n<CORE_VIEWS.length)go(CORE_VIEWS[n]);}
}

   case 'goal-save':{const name=val('g-name').trim(),target=numv('g-target');if(!name||!target)return toast('Pon un nombre y una cantidad.');
     change(()=>{let g=state.goals.find(x=>x.id===id);if(!g){g={id:'g_'+uid()};state.goals.push(g);}Object.assign(g,{name,target,date:val('g-date'),acc:val('g-acc'),saved:numv('g-saved')||0});},'Bolsillo guardado');$('modal').close();break;}
   case 'goal-del':change(()=>{state.goals=state.goals.filter(x=>x.id!==id);},'Bolsillo eliminado');$('modal').close();break;
   case 'theme':change(()=>{state.settings.theme=document.documentElement.dataset.theme==='light'?'dark':'light';});break;
   case 'hide':change(()=>{state.settings.hide=!state.settings.hide;});break;
   case 'menu':go('mas');break;
   case 'forecast':{const f=forecast();modal('Previsión a fin de mes','<div class="kv"><dt>Saldo de hoy (banco y efectivo)</dt><dd>'+money(f.bal)+'</dd>'+(f.salary?'<dt>Nómina que aún no ha llegado</dt><dd class="up">'+money(f.salary,{sign:true})+'</dd>':'')+'<dt>Cargos fijos pendientes</dt><dd>'+money(-f.fixed)+'</dd><dt>Gasto normal previsto ('+Math.round(f.left)+' días)</dt><dd>'+money(-f.variable)+'</dd><dt><b>Saldo estimado</b></dt><dd><b>'+money(f.end)+'</b></dd></div><p class="note">El gasto normal es tu media diaria de los 3 últimos meses sin contar los cargos fijos. La nómina se suma si este mes aún no ha llegado.</p>');break;}
   case 'cushion':{const c=cushion();modal('Colchón de emergencia','<div class="big" style="font-size:36px">'+(c!=null?nf(c,1,1)+' meses':'—')+'</div><div class="kv" style="margin-top:14px"><dt>Dinero disponible</dt><dd>'+money(liquidity())+'</dd><dt>Gasto medio al mes</dt><dd>'+money(avgMonthlyExpense())+'</dd></div><p class="note">Es cuánto tiempo podrías cubrir tus gastos con el dinero que tienes a mano (banco, efectivo y stablecoins), sin vender inversiones. Lo recomendable es tener de 3 a 6 meses.</p>'+btn(ico('target')+'Crear objetivo de colchón','data-act="goal-new"','small'));break;}
   case 'tx-save':{
     const cat=val('tx-cat'),note=val('tx-note').trim();
     if(!id){const amt=numv('tx-amt'),desc=val('tx-desc').trim();if(amt==null||!desc)return toast('Pon un concepto y un importe.');change(()=>state.tx.push({id:'t_'+uid(),acc:val('tx-acc'),date:val('tx-date'),desc,amount:round(amt),bal:null,cat,note,src:'manual'}),'Movimiento añadido');}
     else{const t=state.tx.find(x=>x.id===id),mer=merchantOf(t.desc),all=$('tx-all')?.checked;
       change(()=>{t.cat=cat;t.note=note;if(all){state.rules=state.rules.filter(r=>r.match!==mer);state.rules.unshift({id:'r:'+mer,match:mer,cat});for(const x of state.tx)if(merchantOf(x.desc)===mer)x.cat=cat;}},all?'Categoría aplicada a «'+mer+'» (y a los próximos)':'Guardado');}
     $('modal').close();break;}
   case 'tx-del':change(()=>{state.tx=state.tx.filter(x=>x.id!==id);},'Movimiento eliminado');$('modal').close();break;
   case 'add-op':editOp('');break;
   case 'op-save':{
     const acc=val('op-acc'),date=val('op-date')+' 12:00:00',asset=normAsset(val('op-asset')),qty=numv('op-qty');
     if(!acc||!asset||!qty)return toast('Completa cuenta, activo y cantidad.');
     if(id){change(()=>{const l=state.ledger.find(x=>x.id===id);Object.assign(l,{acc,t:l.t.slice(0,10)===val('op-date')?l.t:date,asset,change:qty,kind:val('op-kind')});},'Operación guardada');}
     else{const k=val('op-kind'),eur=numv('op-eur'),fee=numv('op-fee')||0,ref='man|'+uid();
       change(()=>{ensureAsset(asset);const add=(o)=>state.ledger.push({id:'l_'+uid(),acc,t:date,ref,src:'manual',note:'Manual',...o});
         if(k==='buy'){add({asset,change:Math.abs(qty),kind:'trade'});add({asset:'EUR',change:-Math.abs(eur||0)-fee,kind:'trade'});}
         else if(k==='sell'){add({asset,change:-Math.abs(qty),kind:'trade'});add({asset:'EUR',change:Math.abs(eur||0)-fee,kind:'trade'});}
         else if(k==='deposit'){const l={id:'l_'+uid(),acc,t:date,ref,asset,change:Math.abs(qty),kind:'deposit',src:'manual',note:'Manual'};state.ledger.push(l);if(eur!=null)state.costs[l.id]=Math.abs(eur)+fee;}
         else if(k==='reward')add({asset,change:Math.abs(qty),kind:'reward'});
         else add({asset,change:-Math.abs(qty),kind:'withdraw'});
       },'Operación añadida');refreshPrices();}
     $('modal').close();break;}
   case 'op-del':change(()=>{state.ledger=state.ledger.filter(x=>x.id!==id);},'Operación eliminada');$('modal').close();break;
   case 'asset-save':change(()=>{const x=state.assets[id]=state.assets[id]||{};x.cls=val('as-cls');x.yahoo=val('as-yahoo').trim();x.tv=val('as-tv').trim();x.name=val('as-name').trim();},'Activo guardado');$('modal').close();refreshPrices();break;
   case 'add-deriv':editDeriv('');break;
   case 'dv-save':{
     const g=k=>val('dv-'+k),n=k=>numv('dv-'+k);
     const d={id:id||'d_'+uid(),instr:g('instr').trim(),type:g('type'),side:g('side'),size:n('size'),entry:n('entry'),lev:n('lev'),margin:n('margin'),quote:g('quote'),markSym:normAsset(g('markSym')),mark:n('mark'),closeDate:g('closeDate'),exit:n('exit'),fees:n('fees')};
     if(!d.instr||!d.size||!d.entry)return toast('Pon instrumento, tamaño y precio de entrada.');
     change(()=>{const i=state.derivs.findIndex(x=>x.id===d.id);if(i>=0)state.derivs[i]=d;else state.derivs.push(d);},'Posición guardada');$('modal').close();if(d.markSym)refreshPrices();break;}
   case 'dv-del':change(()=>{state.derivs=state.derivs.filter(x=>x.id!==id);state.deleted[id]=Date.now();},'Posición eliminada');$('modal').close();break;
   case 'add-acc':editAcc('');break;
   case 'acc-save':{const name=val('ac-name').trim();if(!name)return toast('Ponle un nombre.');
     change(()=>{let a=accById(id);if(!a){a={id:'a_'+uid(),currency:'EUR'};state.accounts.push(a);}Object.assign(a,{name,kind:val('ac-kind'),inst:val('ac-inst').trim(),manualBal:numv('ac-bal'),reportsSpain:$('ac-rs').checked});if($('ac-api'))a.useApi=$('ac-api').checked;},'Cuenta guardada');$('modal').close();break;}
   case 'acc-del':if(!confirmTwice(el))return;change(()=>{state.accounts=state.accounts.filter(a=>a.id!==id);state.tx=state.tx.filter(t=>t.acc!==id);state.ledger=state.ledger.filter(l=>l.acc!==id);delete state.apiBal[id];state.deleted[id]=Date.now();},'Cuenta eliminada');$('modal').close();break;
   case 'budgets':go('objetivos');break;
   case 'rule-del':change(()=>state.rules.splice(+id,1),'Regla quitada');break;
   case 'export':download('Finanzas_copia_'+today()+'.json',JSON.stringify(syncPayload(),null,1));break;
   case 'wipe':if(!confirmTwice(el))return;{const keep=clone(state.settings);change(()=>{state=defaults();state.settings=keep;},'Datos borrados');}break;
   case 'gen-token':$('set-token').value=randKey(24);$('set-token').dataset.fresh='1';toast('TOKEN nuevo generado y enmascarado. Cópialo y cámbialo también en Cloudflare.');break;
   case 'copy-token':{const t=val('set-token');if(!t)return toast('Primero genera o pega un TOKEN nuevo.');await copyText(t,'TOKEN nuevo copiado. Pégalo como secreto TOKEN en Cloudflare.');break;}
   case 'copy-worker':try{const r=await fetch('worker.js',{cache:'no-store'});if(!r.ok)throw 0;await copyText(await r.text(),'Código del Worker copiado. Pégalo en Cloudflare.');}catch(e){toast('No encuentro worker.js junto a la app.');}break;
   case 'worker-test':{
     state.settings.worker=val('set-worker').trim().replace(/\/+$/,'');if(val('set-token').trim())state.settings.token=val('set-token').trim();save(false);
     $('worker-res').innerHTML='<p class="muted">Probando…</p>';
     try{state.workerInfo=await api('/ping');}catch(e){state.workerInfo={error:e.message};}
     $('worker-res').innerHTML=workerInfoHTML(state.workerInfo);if(!state.workerInfo.error){syncBalances();if(state.settings.sync)syncNow();}
     break;}
   case 'sync-on':state.settings.sync=randKey(32);state.settings.lastSync=0;state.settings.lastRemote=0;state.settings.lastPush=0;state.settings.pushed=-1;save(false);await syncNow(true);render();break;
   case 'sync-off':state.settings.sync='';save(false);render();break;
   case 'sync-now':if(!syncOn()){go('ajustes');toast('Activa la sincronización en Ajustes.');break;}await syncNow(true);if(state.settings.worker)syncBalances();break;
   case 'pair-copy':copyText(pairLink(),'Enlace copiado. Ábrelo en el móvil.');break;
   case 'pair-share':navigator.share({title:'Finanzas',text:'Vincular Finanzas',url:pairLink()}).catch(()=>{});break;
   case 'tax-prices':{taxBusy=true;render();try{const n=await taxPrefetch((i,t)=>{const b=document.querySelector('[data-act="tax-prices"]');if(b)b.textContent='Precios '+i+' de '+t+'…';});toast(n?'Precios históricos descargados: '+n:'Ya estaban todos los precios');}catch(e){toast(e.message);}taxBusy=false;render();break;}
   case 'tax-csv':taxCSV(String(state.settings.taxYear||val('tax-year')));break;
   case 'tax-ai':copyText(taxAIText(val('tax-year')),'Copiado: pégalo en Gemini, Claude o envíalo a tu gestor.');break;
   case 'tax-721':{const y=val('tax-year');el.textContent='Calculando…';const r=await modelo721(y);m721={...r,year:y};render();break;}
  }
}
// Las acciones que borran mucho piden un segundo toque.
function confirmTwice(el){if(el.dataset.sure)return true;el.dataset.sure='1';el.textContent='Toca otra vez para confirmar';setTimeout(()=>{delete el.dataset.sure;},4000);return false;}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-go],[data-act],[data-tx],[data-range],[data-dismiss],[data-asset],[data-acc],[data-deriv],[data-op],[data-set],[data-invview],[data-fcat],[data-day],[data-qtype],[data-pick],[data-goal],[data-month],[data-ftype],[data-qcat],[data-scenario]');if(!t)return;
  const d=t.dataset;
  if(d.act){e.preventDefault();await act(d.act,t);return;}
  if(d.go){if($('modal').open)$('modal').close();go(d.go,d.gof?JSON.parse(d.gof):null);return;}
  if(d.tx){editTx(d.tx);return;}
  if(d.fcat!=null){filt.cat=d.fcat;render();return;}
  if(d.day){filt.day=filt.day===d.day?'':d.day;filt.m=d.day.slice(0,7);render();return;}
  if(d.qtype){qType=d.qtype;const keep={a:val('q-amt'),d:val('q-desc'),dt:val('q-date')};quickAdd();$('q-amt').value=keep.a;$('q-desc').value=keep.d;$('q-date').value=keep.dt;return;}
   if(d.qcat){$('q-cat').value=d.qcat;$$('[data-qcat]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return;}
  if(d.pick){const box=t.parentElement;box.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));const h=box.nextElementSibling;if(h&&h.type==='hidden')h.value=d.pick;return;}
  if(d.goal){editGoal(d.goal);return;}
  if(d.month!=null){if(view!=='movimientos')go('movimientos',{m:d.month,all:!d.month,type:'out',cat:''});else{filt.m=d.month;filt.all=!d.month;filt.day='';render();}return;}
  if(d.ftype!=null){filt.type=d.ftype;render();return;}
  if(d.range){range=d.range;render();return;}
  if(d.invview){invView=d.invview;render();return;}
  if(d.scenario){marketShock=+d.scenario;render();return;}
  if(d.dismiss){state.dismissed[d.dismiss]=Date.now();save(false);render();return;}
  if(d.asset){assetDetail(d.asset);return;}
  if(d.acc){editAcc(d.acc);return;}
  if(d.deriv){editDeriv(d.deriv);return;}
  if(d.op){editOp(d.op);return;}
  if(d.set){let v=d.val;if(v==='true'||v==='false')v=v==='true';change(()=>{state.settings[d.set]=v;});if(d.set==='show')refreshPrices();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-q'){filt.q=t.value;clearTimeout(t._tm);t._tm=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('f-q');n.focus();n.setSelectionRange(pos,pos);},250);}
});
document.addEventListener('change',e=>{
  const t=e.target,m={'f-m':'m','f-cat':'cat','f-type':'type','f-acc':'acc'}[t.id];
  if(m){filt[m]=t.value;render();return;}
  if(t.id==='tax-year'){state.settings.taxYear=t.value;m721=null;save(false);render();return;}
  if(t.id==='tax-extra'){taxExtra=toNum(t.value)||0;render();return;}
  if(t.id==='set-low'){change(()=>{state.settings.lowBal=toNum(t.value)||0;});return;}
  if(t.dataset.budget){const v=toNum(t.value);change(()=>{if(v>0)state.budgets[t.dataset.budget]=v;else delete state.budgets[t.dataset.budget];});return;}
  if(t.dataset.cost){const v=toNum(t.value);change(()=>{if(isFinite(v))state.costs[t.dataset.cost]=v;else delete state.costs[t.dataset.cost];},'Coste guardado');return;}
  if(t.id==='file-in'){importFiles([...t.files]);t.value='';}
});
function afterRender(){
  bindCharts();
  // Entrada suave solo al cambiar de pantalla (no en cada actualización de precios).
  if(view!==lastView){const g=$('main').querySelector('.grid,.tiles');if(g)g.classList.add('anim');lastView=view;}
  const drop=$('drop');
  if(drop&&!drop._b){drop._b=1;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));drop.addEventListener('drop',e=>importFiles([...e.dataTransfer.files]));}
}
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{if(!e.target.closest('#drop')){e.preventDefault();if(e.dataTransfer?.files?.length)importFiles([...e.dataTransfer.files]);}});
$('modal-close').onclick=()=>{$('modal').close();$('modal').classList.remove('asset-dialog');};
document.addEventListener('pointerdown',gestureStart,{passive:true});
document.addEventListener('pointermove',gestureMove,{passive:false});
document.addEventListener('pointerup',gestureEnd,{passive:true});
document.addEventListener('pointercancel',gestureEnd,{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
$('toast-undo').onclick=undo;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='auto')render();});

// ===== Arranque =====
// Todo se actualiza solo: precios, saldos de los exchanges y sincronización, al abrir, al volver a la app, al recuperar internet y cada poco mientras está abierta.
function refreshAll(force){
  snapshot();
  if(syncOn())syncNow();
  if(state.settings.worker){if(force||Date.now()-(state.apiTs||0)>5*60e3)syncBalances();}
  else if(state.accounts.length)refreshPrices();
}
function init(){
  readPair();
   try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});}catch(e){}
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)||h==='mas')view=h;
  if(h==='quick')view='resumen';
  // La pestaña Gastos abre por defecto el mes más reciente con movimientos.
  filt.m=state.tx.map(t=>monthKey(t.date)).sort().at(-1)||'';
  ready=true;snapshot();autoBackup();render();
  document.body.dataset.ready='true';
  if(state.accounts.length)refreshPrices();
  if(state.settings.worker){syncNow();syncBalances();api('/ping').then(x=>{state.workerInfo=x;save(false);if(view==='ajustes')render();}).catch(()=>{});}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll();});
  addEventListener('online',()=>refreshAll());
  addEventListener('focus',()=>{if(syncOn())syncNow();});
  // Cada minuto mira si el otro dispositivo ha cambiado algo; cada N minutos, precios y saldos.
  setInterval(()=>{if(document.visibilityState==='visible'&&syncOn())syncNow();paintSync();},60e3);
  setInterval(()=>{if(document.visibilityState!=='visible')return;if(state.settings.worker)syncBalances();else if(state.accounts.length)refreshPrices();snapshot();},Math.max(5,+state.settings.autoMinutes||15)*60e3);
}
init();
</script>
